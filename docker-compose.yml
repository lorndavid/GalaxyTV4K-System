services:
  postgres:
    image: postgres:15-alpine
    container_name: system_hr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hr_attendance_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hr_attendance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: system_hr_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hr_attendance_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-signing-key-replace-in-production-min-32-chars}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174}
    ports:
      - "4000:4000"

  admin:
    build:
      context: ./admin
      dockerfile: ../docker/admin.Dockerfile
    container_name: system_hr_admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  web:
    build:
      context: ./web
      dockerfile: ../docker/web.Dockerfile
    container_name: system_hr_web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5174:80"

volumes:
  postgres_data:
    driver: local
