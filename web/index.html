    <!-- Cloudflare RUM / Web-Vitals Unhandled Exception Shield -->
    <script>
      (function() {
        window.addEventListener('error', function(event) {
          if (event.message && (event.message.indexOf('startTime') !== -1 || event.message.indexOf('reportAllChanges') !== -1)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.onerror = function(msg) {
          if (typeof msg === 'string' && (msg.indexOf('startTime') !== -1 || msg.indexOf('reportAllChanges') !== -1)) {
            return true;
          }
        };

        if (typeof window !== 'undefined' && 'PerformanceObserver' in window) {
          var OrigPO = window.PerformanceObserver;
          window.PerformanceObserver = function(callback) {
            var safeCallback = function(list, observer) {
              try {
                return callback(list, observer);
              } catch (err) {
                if (err && err.message && err.message.indexOf('startTime') !== -1) {
                  return;
                }
                throw err;
              }
            };
            return new OrigPO(safeCallback);
          };
          window.PerformanceObserver.prototype = OrigPO.prototype;
          window.PerformanceObserver.supportedEntryTypes = OrigPO.supportedEntryTypes;
        }

        var origSetTimeout = window.setTimeout;
        window.setTimeout = function(fn, delay) {
          if (typeof fn === 'function') {
            var safeFn = function() {
              try {
                return fn.apply(this, arguments);
              } catch (err) {
                if (err && err.message && err.message.indexOf('startTime') !== -1) {
                  return;
                }
                throw err;
              }
            };
            return origSetTimeout.apply(this, [safeFn, delay]);
          }
          return origSetTimeout.apply(this, arguments);
        };
      })();
    </script>

    <!-- Anti-Flash Early Theme Bootstrap -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('system_hr_theme') || 'system';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-dark-bg text-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-brand-600 selection:text-white overscroll-none transition-colors duration-150">
